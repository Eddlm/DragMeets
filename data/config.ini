[RACERS]
;This section covers how AI Racers behave.


;Edit these values to set the minimum money AI Racers can have.
;They're separated in different car classes to allow variety and proper "car driven-money in the pocket" ratio.
MinRacerMoneyMuscle=30000
MinRacerMoneySports=40000
MinRacerMoneySuper=50000
MinRacerMoneyOther=10000

;Enables pre-designed tuning to be applied to the racers.
RacerBlips=true

;Enables pre-designed tuning to be applied to the racers.
UseDesigns=true

;Forces generic cars to be randomly tuned.
;Generic cars are cars without a PrimaryColor defined (in Racers.xml).
RandomTuningGeneric=true

;Forces ALL cars to be randomly tuned. Overrides UseDesigns and RandomTuningGeneric.
RandomTuningAll=false

;When enabled, racers will save their stats (money, reputation, skill gains) across sessions. If disabled, racers will always spawn with predefined/random stats.
PersistentRacers=false

;Enable this to have the script automatically introduce new (generic) Racers based on the cars you use in a Meet.
;This allow you to add Add-On vehicles for the script to use as Racers.
AddNewRacers=true

;Remember that you can save the car manually by entering "save car" or "save car details" in the cheat prompt anytime. It has the same effect.

;Controls the overall carefulness of the drivers. Lower it if you have realistic handling mods or the AI smashes too much into stuff.
SpeedMultiplier=100

;Enables the drag parachute feature. Only specific cars will use them (cars with Parachute defined in Racers.xml)
DragParachutes=true

;Forces all supercars to use drag parachutes. Requires DragParachutes on.
AllSupercarsUseParachute=true


[MEETS]
;General tweaking.

;By default, Meets will spawn automatically.
;If you don't like that, enable this to make the spawn manually done by you when you get to the meet.
ManualMeetSpawn=false
;Set to true if you want all meets to have SelfRadio as their radio station. Othervwise, each Meet will have its own.
AlwaysSelfRadio=false

;Allows nitro usage on all races. You can use it by pressing E while racing.
AllowNitro=false

;If you use a realistic handling mod, you can use this to reduce the Track lenght and give the cars more space to brake.
TrackLength=100

;Works as a percentage. 100 means the original track length.
;80 is reccomended for realistic handling mods.


;Reserved for Official Meets, Fee and Prize are used as a default values for the entry fee and winning prize.
Fee=800
Prize=5000
;Each Meet can override these values in its file.

;How much money Racers can bet on other Racers, you included.
Bet=50
;Note: Some Meets have their own betting ang prizes which will override these values.
;You can disable them by opening the meet file and removing the options you don't want enforced.


;Enable this if you want Meets to be disbanded if the police appears.
;Not implemented yet
PoliceDisbandsMeets = false

;Allows the game to use cinematic shots for the NPC vs NPC races.
;To use it, aim at the starting line while the betting is being done.
CinematicCam = true

[INFO]
;Section regarding all notifications/help text/info the script will display.

;Allows Lamar to contact you about the available races. 
LamarNotifications=false

;Disable this if you don't want the various tutorials.
Guides=true

;Given that other racers actually bet, win and lose money, the script usually notifies you of all the things they do. Helps making the Meet more lively.
;Disable this if you don't want these notifications.
ActivityNotifications=true

;Enable this to get notifications of the AI shifting mid-race.
ShowGoodBadShifting=false

;Enabled notifications regarding the grip of the cars.
ShowGrip=false

;Enable this if you want the game to show reaction times when you bet or participate.
ShowReactionTimes = false


[SIMULATION]
;This section involves the realistic side of Drag Meets.
;Disable everything for simpler gameplay, enable everything for an interesting experience.

;If enabled, not every racer will accept your challenges. First they will analize their situation and then decide if they have a chance of winning or not.
;If disabled, you can challenge everyone without restrictions.
FairChallenges=true

;Enables realistic wheelie behavior. Otherwise, every car with enough grip will be able to wheelie.
RealisticWheelies=true

;If you feel like wheelies are too weak (or too strong), change this value. Works as a percentage, 200 will be double the usual force, 50 will be half.
WheelieForce=100

;Enable this if you want AI to have random reaction times. Else, their reaction time will be 0.
ReactionTimes = true

;Simulates Tire performance, based on its temperature and type:
;- Warm tires have more grip.
;- Street/High End tires have more grip on road, Offroad Tires have more grip on dirt.
SimulateTirePerformance = true

;This enables a player minigame that attempts to simulate manual transmission.
;Depending on how timely you change gear, you'll get a temporary boost or speed penalty.
;AI drivers will simulate this too.
SimulateManualTransmission = true
;If you have a Manual Transmission mod already, keep this enabled, and enable MT_Support support in the COMPATIBLITY section.


[COMPATIBLITY]
;Enable this if you're using a Mannual Transmision mod.
;It will remove the shifting minigame for you, and disable perfect shiftings for the AI.
MT_Support=false

;The AI will still be able to have bad shiftings. If you want to remove that aswell, disable "SimulateManualTransmission" in the SIMULATION section.


;If you get absurdly low FPS while playing this script, enable this. It will remove all crowds and cap the max racer count to 12.
FPSFriendly=false
[DEBUG]
;General debug notifications.
DebugNotifications=false


[KEYS]
;You can change the script input keys here.
ShiftingKey=Sprint
InteractKey=Context

;Get the key names from https://github.com/crosire/scripthookvdotnet/blob/157ac57f9530a1cf55afa61d81a066849b52f8ba/source/scripting/Controls.hpp#L243
;(use the name before the =, not the number after it)
;Remember that these are not specific physical keys but inputs from the game.
;For example, "Context" means whatever key you have configured for Contextual interaction, usually its the E key, or Dpad-Right.

;Reccomended keys for keyboard users: Context (E by default), Duck (X by default), Sprint (Shift key by default)
;Reccomended keys for gamepads: ScriptRUp (Y), ScriptRDown (A), ScriptRLeft  (X), ScriptRRight (B).

